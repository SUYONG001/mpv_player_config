# ============================================================
#  title_filename.conf — 窗口标题自定义
#  对应脚本：title_filename.lua
# ============================================================

# --- 标题格式 ---
# 支持 mpv 属性展开语法：
#   ${filename}      完整文件名，含扩展名
#   ${media-title}   媒体标题（有封面音频时是内嵌歌曲名）
#   ${path}          完整路径
#   ${file-ext}      仅扩展名
#
# 【重要】键名必须顶格写，前面不能有空格或 Tab。
#   否则 mpv 会把它当成另一个键名，导致配置不生效。
#
# 【如何切换】下面是常用的几种写法，只保留一行生效：
#   1. 把想用的那一行前面的 # 去掉，并顶格
#   2. 把其他 title_format 行前面加上 #
#   3. 同一份 conf 里只有最后一个 title_format 生效
#
# --- 可选标题格式（只保留一行生效）---

# 显示文件名含扩展名
# title_format=${filename}

# 显示内嵌标题（无则回退文件名）
title_format=${media-title}

# 加前缀
# title_format=【音楽】${media-title}

# 文件名含扩展名 + 自定义后缀
# title_format=${filename} - 我的播放器

# ============================================================
#  截断过长标题
# ============================================================

# yes = 启用截断；no = 不截断（长文件名会让窗口标题很长）
# 截断按 UTF-8 字符计算，中日文按 1 字符算，不会出现半个字
# 超过长度会追加 "..."
slice_longfilenames=no

# 截断到多少个字符（仅在 slice_longfilenames=yes 时有效）
slice_longfilenames_amount=70