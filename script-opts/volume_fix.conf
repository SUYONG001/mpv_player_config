# ============================================================
#  volume_fix.conf — 音视频独立配置
#  对应脚本：volume_fix.lua
# ============================================================

# --- 是否启用固定音量接管 ---
# yes：每次换视频/换音频时，强行重置为下方设定的固定音量
# no ：关闭固定音量接管，音量完全跟随全局记忆（推荐，切集与重启不重置）
enable_volume=no

# --- 音频文件默认音量（仅在 enable_volume=yes 时生效）---
# 打开 .flac、.mp3、.cue 等音频文件时自动应用的音量百分比
# 取值范围：0 ~ 100（百分比）
audio_vol=90

# --- 视频文件默认音量（仅在 enable_volume=yes 时生效）---
# 打开 .mkv、.mp4 等视频文件时自动应用的音量百分比
# 取值范围：0 ~ 100（百分比）
video_vol=100

# --- 音频模式缩放分辨率 ---
# 音频文件（无视频轨道）播放时，封面渲染的目标高度（像素）
# 宽度由封面原始比例自动计算，force_original_aspect_ratio=decrease 保证不变形
# 默认值：1080（常用可选：720、960、1080、1440）
audio_scale_height=960